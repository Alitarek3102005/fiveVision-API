server:
  port: 8081

spring:
  application:
    name: 5vision-api

  datasource:
    url: jdbc:postgresql://localhost:5433/nature_db
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/5vision

storage:
  endpoint-url: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  region: us-east-1
  bucket-name: 5vision-media

clamav:
  host: localhost
  port: 3310

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.modulith: INFO