openapi: 3.0.3
info:
  title: 5Vision Media API
  version: 1.3.0
  description: Handles media uploads, MinIO presigned URLs, asset variants, and malware scanning.

security:
  - bearerAuth: []

tags:
  - name: Media
    description: Media asset management

paths:
  /api/v1/media:
    get:
      tags: [Media]
      summary: List and filter media assets (Admin/Author)
      operationId: getMediaAssets
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: sort
          in: query
          schema: { type: string, default: "createdAt,desc" }
        - name: type
          in: query
          schema: { type: string, enum: [PHOTO, VIDEO, THUMBNAIL] }
        - name: status
          in: query
          schema: { type: string, enum: [PROCESSING, SCANNING, READY, FAILED] }
      responses:
        '200':
          description: Paginated media assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMediaResponse'

  /api/v1/media/upload-url:
    post:
      tags: [Media]
      summary: Request a presigned MinIO URL for direct client upload
      operationId: initiateUpload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateUploadRequest'
      responses:
        '200':
          description: Presigned URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiateUploadResponse'

  /api/v1/media/{id}/complete:
    post:
      tags: [Media]
      summary: Confirm upload completion and save technical metadata; triggers malware scan
      operationId: completeUpload
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteUploadRequest'
      responses:
        '200':
          description: Upload accepted and scheduled for malware scanning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'

  # -------------------------------------------------------------------
  # NEW: bulk delete. Placed before /{id} so the path matcher picks the
  # literal segment instead of treating "bulk-delete" as a UUID.
  # -------------------------------------------------------------------
  /api/v1/media/bulk-delete:
    post:
      tags: [Media]
      summary: Delete multiple media assets in a single request (Admin/Author)
      operationId: bulkDeleteMedia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteMediaRequest'
      responses:
        '200':
          description: Per-item delete result. Partial failures are reported in `errors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkDeleteMediaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/media/{id}:
    get:
      tags: [Media]
      summary: Get media asset details
      operationId: getMediaById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Asset details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAssetResponse'
    delete:
      tags: [Media]
      summary: Delete a media asset and its MinIO object
      operationId: deleteMedia
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PagedMediaResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MediaAssetResponse'
        pageNumber: { type: integer }
        pageSize: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        isLast: { type: boolean }

    InitiateUploadRequest:
      type: object
      required: [fileName, mimeType, sizeBytes, type]
      properties:
        fileName: { type: string }
        mimeType: { type: string }
        sizeBytes: { type: integer, format: int64 }
        type: { type: string, enum: [PHOTO, VIDEO, THUMBNAIL] }

    InitiateUploadResponse:
      type: object
      properties:
        mediaId: { type: string, format: uuid }
        uploadUrl: { type: string, format: uri }
        fileKey: { type: string }
        expiresAt: { type: string, format: date-time }

    CompleteUploadRequest:
      type: object
      properties:
        resolutionWidth:
          type: integer
          minimum: 1
          maximum: 16384
        resolutionHeight:
          type: integer
          minimum: 1
          maximum: 16384
        durationSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        cameraModel:
          type: string
          maxLength: 100
        lensInfo:
          type: string
          maxLength: 100

    MediaAssetResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        uploaderId: { type: string, format: uuid }
        type: { type: string, enum: [ PHOTO, VIDEO, THUMBNAIL ] }
        status: { type: string, enum: [ PROCESSING, SCANNING, READY, FAILED ] }

        # Original full-resolution file. Null while not READY.
        cdnUrl: { type: string, format: uri }

        # Small 400px-max variant. Null while not READY or if generation failed.
        thumbnailUrl: { type: string, format: uri }

        # Medium 1920px-max variant. Null while not READY or if generation failed.
        largeUrl: { type: string, format: uri }

        fileSizeBytes: { type: integer, format: int64 }
        mimeType: { type: string }
        resolutionWidth: { type: integer }
        resolutionHeight: { type: integer }
        durationSeconds: { type: integer }
        cameraModel: { type: string }
        lensInfo: { type: string }
        createdAt: { type: string, format: date-time }

    # -----------------------------------------------------------------
    # NEW — bulk delete request / response
    # -----------------------------------------------------------------
    BulkDeleteMediaRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { type: string, format: uuid }

    BulkDeleteMediaResponse:
      type: object
      properties:
        deleted:
          type: integer
          description: Number of assets successfully deleted.
        failed:
          type: integer
          description: Number of assets that could not be deleted.
        errors:
          type: array
          description: One entry per failed asset, in the order the failures occurred.
          items:
            type: object
            properties:
              id:    { type: string, format: uuid }
              error: { type: string }
        deletedIds:
          type: array
          description: IDs that were successfully deleted. Useful for client-side pruning.
          items: { type: string, format: uuid }

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        validationErrors:
          type: object
          additionalProperties:
            type: string