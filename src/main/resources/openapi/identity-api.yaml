openapi: 3.0.3
info:
  title: 5Vision Identity API
  version: 1.2.0
  description: Handles user profile synchronization with Keycloak and public profiles.
security:
  - bearerAuth: []
tags:
  - name: Users
    description: User profile and identity management

paths:
  /api/v1/users:
    get:
      tags: [Users]
      summary: List and search users (Admin)
      operationId: getUsers
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0, minimum: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
        - name: search
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, default: "createdAt,desc" }
          description: "Format: property,asc|desc. Allowed: createdAt, username, email, lastLogin"
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the currently authenticated user's profile
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Users]
      summary: Update the current user's profile details
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/sync:
    post:
      tags: [Users]
      summary: Sync Keycloak JWT token data to the local database
      description: Uses the authenticated user's JWT claims to create or update the local user record.
      operationId: syncUser
      responses:
        '200':
          description: User synchronized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get a user's public profile summary
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Public user summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak-issued JWT token

  responses:
    BadRequest:
      description: Invalid request parameters or body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    PagedUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileResponse'
        pageNumber: { type: integer }
        pageSize: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        isLast: { type: boolean }

    UpdateProfileRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-zÀ-ÖØ-öø-ÿ'' -]+$'
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[A-Za-zÀ-ÖØ-öø-ÿ'' -]+$'

    UserProfileResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [CUSTOMER, AUTHOR, ADMIN]
        createdAt: { type: string, format: date-time }
        lastLogin: { type: string, format: date-time }

    UserSummaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role:
          type: string
          enum: [CUSTOMER, AUTHOR, ADMIN]

    ErrorResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        status: { type: integer }
        error: { type: string }
        message: { type: string }
        path: { type: string }
        validationErrors:
          type: object
          additionalProperties:
            type: string