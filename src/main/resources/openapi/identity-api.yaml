openapi: 3.0.3
info:
  title: 5Vision Identity API
  version: 1.1.0
  description: Handles user profile synchronization with Keycloak and public profiles.

tags:
  - name: Users
    description: User profile and identity management

paths:
  /api/v1/users:
    get:
      tags: [Users]
      summary: List and search users (Admin)
      operationId: getUsers
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 0 }
        - name: size
          in: query
          schema: { type: integer, default: 20 }
        - name: search
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema: { type: string, default: "createdAt,desc" }
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedUserResponse'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get the currently authenticated user's profile
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
    put:
      tags: [Users]
      summary: Update the current user's profile details
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /api/v1/users/sync:
    post:
      tags: [Users]
      summary: Sync Keycloak JWT token data to the local database
      operationId: syncUser
      responses:
        '200':
          description: User synchronized successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'

  /api/v1/users/{id}:
    get:
      tags: [Users]
      summary: Get a user's public profile summary
      operationId: getUserById
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Public user summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummaryResponse'

components:
  schemas:
    PagedUserResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserProfileResponse'
        pageNumber: { type: integer }
        pageSize: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
        isLast: { type: boolean }

    UpdateProfileRequest:
      type: object
      required: [firstName, lastName]
      properties:
        firstName: { type: string }
        lastName: { type: string }

    UserProfileResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string }
        createdAt: { type: string, format: date-time }
        lastLogin: { type: string, format: date-time }

    UserSummaryResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        role: { type: string }